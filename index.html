<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden}
body{background:#e9edf2;color:#1d2733;font-family:"DejaVu Sans","Noto Sans","Noto Sans CJK JP",Arial,sans-serif;padding:18px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:128px 1fr 100px 1fr 40px;gap:14px;position:relative}
.t{background:#fff;border-radius:22px;padding:14px 20px;box-shadow:0 3px 10px #0001;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.h{font-size:17px;font-weight:700;color:#6b7785;text-transform:uppercase;letter-spacing:2px;white-space:nowrap}
.clk{grid-column:span 2;background:#1d2733;color:#fff;flex-direction:row;justify-content:space-between;align-items:center}
.clk .fe{font-size:26px;line-height:1.3}.clk .fe small{display:block;font-size:17px;color:#9fb0c2;margin-top:4px;white-space:nowrap}
.clk b{font-size:90px;line-height:1}
.w{grid-column:span 2;background:linear-gradient(135deg,#4fa3e0,#7cc4f0);color:#fff;flex-direction:row;align-items:center;gap:20px}
.w .ico{font-size:64px}.w b{font-size:72px}.w .d{font-size:22px;line-height:1.5;white-space:nowrap}
.mi{grid-column:span 2;grid-row:span 3;color:#fff;gap:6px}
.mi.si{background:#2e7d32}.mi.no{background:#c62828}.mi.na{background:#607080}
.mi .h{color:#ffffffcc}
.mi .y{font-size:72px;font-weight:800;line-height:1.05;margin-top:4px;white-space:nowrap}
.mi .d{font-size:40px;font-weight:700;white-space:nowrap}.mi .d span{font-weight:400;opacity:.85}
.bn{font-size:34px;font-weight:700;display:none;align-self:flex-start;background:#ffffff26;border-radius:12px;padding:4px 14px;margin-top:4px}.bn.on{display:block}.sac{font-size:28px;opacity:.92;margin-top:-4px}.pill.mx{background:#fff!important;color:#1d2733;border-left:10px solid #006847;border-right:10px solid #ce1126}.na{display:none;font-size:22px;opacity:.9}.na.on{display:block}
.ep{margin-top:auto;background:#ffffff22;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ep.fiesta{background:#ffffff;color:#1d2733;box-shadow:0 0 0 4px #ffd54f}
.ep .cel{font-size:36px;font-weight:700;line-height:1.15}
.ep .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:25px}
.dot{display:inline-block;width:24px;height:24px;border-radius:50%;border:2px solid #0003;vertical-align:middle;margin-right:6px}
.pill{border-radius:999px;padding:3px 12px;font-weight:700;background:#ffffff33;white-space:nowrap}
.ep.fiesta .pill{background:#eef1f5}
.pill.fa{background:#ffd54f!important;color:#3d2c00}
.pill.rk{background:#1d2733!important;color:#ffd54f}
.ep .nt{font-size:25px;line-height:1.25;opacity:.95}
.tu .n{font-size:42px;font-weight:700;margin-top:6px;line-height:1.1}
.adm{grid-column:span 2;flex-direction:row;align-items:center;gap:26px;padding:8px 20px;white-space:nowrap}.adm{flex-direction:column;align-items:flex-start;gap:4px;justify-content:center}.adm .h{font-size:15px}.adm #tAd{display:flex;flex-wrap:wrap;gap:0 20px;font-size:19px;line-height:1.25;overflow:hidden}.adm.vac{opacity:.6}
.tu .m{font-size:23px;color:#6b7785;margin-top:auto;white-space:nowrap}
.ds{background:#fff}.ds.on{background:#ffb300}.ds.on .h{color:#6b4b00}
.ds b{font-size:80px;line-height:1;margin-top:6px}
.qr{display:flex;flex-direction:row;align-items:center;gap:12px;text-decoration:none;color:inherit;background:#fff}.qrc{width:120px;height:120px;flex:none}.qt{flex:1;min-width:0}.qrc svg{width:100%;height:100%;display:block}.qt .h{font-size:14px;line-height:1.25;white-space:normal;letter-spacing:.5px}.qt span{font-size:19px;font-weight:700;line-height:1.2;display:block;margin-top:6px}.ds span{font-size:21px}
.av{grid-column:span 2;gap:8px}
.aviso{font-size:25px;padding:6px 12px;border-radius:10px;background:#fff3cd;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.aviso.chico{font-size:19px;background:transparent;color:#6b7785;padding:0 12px}
.vacio{font-size:20px;color:#9aa5b1;margin-top:6px}
footer{grid-column:span 4;font-size:18px;color:#6b7785;display:flex;align-items:center;justify-content:center;gap:28px;white-space:nowrap}
footer .on{color:#1d2733;font-weight:700}footer .cu{color:#8a5a00}
#overlay{display:none;position:absolute;left:18px;right:18px;top:160px;bottom:18px;background:#ffb300;color:#1d2733;border-radius:26px;flex-direction:column;align-items:center;justify-content:center;gap:24px;box-shadow:0 0 0 6px #fff inset,0 10px 30px #0004;padding:30px;z-index:5}
#overlay .gtxt{font-size:64px;font-weight:800;text-align:center;line-height:1.15}
#overlay .ejg{font-size:26px;font-weight:700;background:#1d2733;color:#ffd54f;border-radius:10px;padding:4px 18px;letter-spacing:3px}
@media (max-width:820px){
html,body{width:100%;height:auto;overflow:auto}
body{grid-template-columns:1fr;grid-template-rows:none;padding:12px;gap:12px}
.clk,.w,.mi,.av,.adm,footer{grid-column:auto;grid-row:auto}
.clk b{font-size:60px}.clk .fe{font-size:20px}.clk .fe small{white-space:normal}
.w .ico{font-size:44px}.w b{font-size:50px}.w .d{font-size:17px;white-space:normal}
.mi .y{font-size:44px;white-space:normal}.bn{font-size:24px}.sac{font-size:22px}.mi .d{font-size:28px;white-space:normal}
.ep .cel{font-size:26px}.ep .meta{font-size:18px}.ep .nt{font-size:19px}.mi{overflow:visible}
.tu .n{font-size:36px}.ds b{font-size:60px}
.aviso{font-size:19px;white-space:normal}
footer{flex-wrap:wrap;white-space:normal;gap:8px 16px;font-size:16px;padding:6px 0}
#overlay{position:fixed;left:10px;right:10px;top:10px;bottom:auto;min-height:40vh}
#overlay .gtxt{font-size:36px}
}
#estado{position:fixed;right:8px;bottom:4px;font-size:11px;color:#9aa5b1}
.qbtn{display:none}
@media (max-width:700px){.qr .qrc,.qr .qt{display:none}.qr{padding:0;background:#1565c0;justify-content:center}.qbtn{display:block;width:100%;padding:18px 12px;color:#fff;font-size:22px;font-weight:700;text-align:center}}
</style></head>

/* ---- Live data: read the sheet tabs as CSV (sheet must be viewable by link). Keeps last good data on failure. */
let HORARIO=null;
function csv(t){const R=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++;}else q=false;}else c+=ch;}
 else if(ch=='"')q=true;else if(ch==","){row.push(c);c="";}else if(ch=="\n"){row.push(c);R.push(row);row=[];c="";}else if(ch!="\r")c+=ch;}
 if(c||row.length){row.push(c);R.push(row);}return R;}
async function tab(n){const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(n)}&t=${Date.now()}`,{cache:"no-store"});
 if(!r.ok)throw new Error(n+" "+r.status);const t=await r.text();if(/^\s*</.test(t))throw new Error(n+" no CSV");return csv(t).slice(1).map(r=>r.map(x=>x.trim()));}
const F8=d=>{d=(d||"").trim();const m=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)||null;if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
 const k=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(k)return k[3]+"-"+k[1].padStart(2,"0")+"-"+k[2].padStart(2,"0");return d;};
const HM=h=>(h||"").replace(/^0(\d):/,"$1:").replace(/:00$/,":00");
const MES3={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12};
const T={
 Misa:r=>{const o={};r.forEach(x=>{const f=F8(x[0]);if(!f)return;const no=/^no/i.test(x[1]||"");let h=x[2]||"";
  const nu=h.match(/NU\s*([\d:]+\s*-\s*[\d:]+)/i);const bo=/\(bosque\)/i.test(x[1]||"")||(/^\s*bosque/i.test(h)&&!nu);
  h=nu?nu[1]:h.replace(/bosque/i,"").trim();
  const d=x[3]||"";const pn=d.match(/NU\s+([A-Z]{2,4})/),pb=d.match(/Bosque\s+([A-Z]{2,4})/);const ini=bo?(pb?pb[1]:(d.match(/[A-Z]{3}/)||[""])[0]):(pn?pn[1]:(/^\s*bosque/i.test(d)?"":(d.match(/[A-Z]{3}/)||[""])[0]));
  o[f]=[no?"No":"Sí",h.replace(/\s*-\s*/,"–"),bo?"Bosque":"Mirreyes","",x[4]||"",(x[5]||"").trim(),(x[6]||"").trim(),ini,(x[7]||"").trim()];});if(Object.keys(o).length)MISA=o;},
 Epacta:r=>{const o={};r.forEach(x=>{const f=F8(x[0]);if(!f||!x[1])return;const n=x[4]||"";const fa=(n.match(/Fiesta [A-D]\b/)||[""])[0];
  const rk=/sin c[oó]digo/i.test(x[3]||"")?"":(x[3]||"");o[f]=[x[1],x[2]||"",rk,fa,n.replace(/\s*Fiesta [A-D]\b/,"").replace(/\s*\(nacional\)/i,"").replace(/\(sin c[oó]digo[^)]*\)/gi,"").trim(),/\(nacional\)/i.test(n),/\bVela\b/.test(n)];});if(Object.keys(o).length)EPACTA=o;},
 Turnos:r=>{const o={};r.forEach(x=>{const f=F8(x[0]);if(/^\d{4}-/.test(f)&&x[2]&&(!x[1]||/turno/i.test(x[1])))o[f]=x[2];});if(Object.keys(o).length)TURNOS=o;},
